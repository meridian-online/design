[package]
name = "meridian-design"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Meridian design tokens — framework-neutral colours, type ramp, spacing, and chart palettes"
repository = "https://github.com/meridian-online/design"

# `license` above covers the code. It does not cover `brand/`, which
# `brand/LICENSE-BRAND.md` reserves — so the brand files no code reads stay out
# of the published tarball. They remain tracked in git and editable; the
# repository and the package are separate artefacts.
#
# Not `brand/sources/`: `src/brand.rs` embeds `Meridian Prime Components.svg`
# from that directory, and dropping it fails `cargo package`'s verify build.
# `tests/packaging.rs` pins both lists.
exclude = ["brand/sources/*.af", "brand/meridian_wordmark.png"]

# Dependency-free by contract (ADR 0003): this crate must remain outside any
# GPL firewall and portable to every consumer (web emission, egui).
[dependencies]
